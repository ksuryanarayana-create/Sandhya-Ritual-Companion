kind = "web"
previewPath = "/"
title = "Sandhya Companion"
version = "1.0.0"
id = "artifacts/sandhya-companion"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20956

[services.development]
run = "pnpm --filter @workspace/sandhya-companion run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sandhya-companion", "run", "build" ]
serve = "static"
publicDir = "artifacts/sandhya-companion/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20956"
BASE_PATH = "/"
